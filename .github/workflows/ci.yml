name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Stamp the version
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILD_CHANNEL=dev" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "VERSION_PRERELEASE=pr${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          fi
          echo "devkit=$(make -s devkit-pin)" >> "$GITHUB_ENV"

      - name: Restore the ounce devkit
        uses: actions/cache@v4
        with:
          path: .cache/ounce-devkit
          key: ounce-devkit-${{ env.devkit }}

      - name: Restore the native deps
        uses: actions/cache@v4
        with:
          path: library/native-deps/out
          key: ounce-deps-${{ env.devkit }}-${{ hashFiles('library/native-deps/config/ounce.toml', 'library/native-deps/deps/*/ounce.toml', 'library/native-deps/deps/*/patches/*', 'library/native-deps/scripts/*') }}

      - name: Build the devkit image
        run: make devkit-image

      - name: Build the native deps
        run: make ounce-deps

      - name: Build akira
        run: make build CLOUD=false

      - name: Upload the NRO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: akira-ounce-nro-${{ env.short }}
          path: build/akira.nro

      - name: Upload the ELF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: akira-ounce-elf-${{ env.short }}
          path: build/akira.elf
