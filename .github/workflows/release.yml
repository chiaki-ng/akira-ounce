name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Derive the version from the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR=$(grep 'set(VERSION_MAJOR' cmake/version.cmake | sed 's/[^0-9]*//g')
          MINOR=$(grep 'set(VERSION_MINOR' cmake/version.cmake | sed 's/[^0-9]*//g')
          PATCH=$(grep 'set(VERSION_PATCH' cmake/version.cmake | sed 's/[^0-9]*//g')
          CORE="${MAJOR}.${MINOR}.${PATCH}"
          VERSION="${TAG#v}"
          PRERELEASE=""
          CHANNEL="stable"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            CHANNEL="rc"
          fi
          if [ "${VERSION%%-*}" != "$CORE" ]; then
            echo "::error::Tag ${TAG} does not match cmake/version.cmake ${CORE}"
            exit 1
          fi
          {
            echo "VERSION=${VERSION}"
            echo "BUILD_CHANNEL=${CHANNEL}"
            echo "VERSION_PRERELEASE=${PRERELEASE}"
            echo "devkit=$(make -s devkit-pin)"
          } >> "$GITHUB_ENV"

      - name: Restore the ounce devkit
        uses: actions/cache@v4
        with:
          path: .cache/ounce-devkit
          key: ounce-devkit-${{ env.devkit }}

      - name: Restore the native deps
        uses: actions/cache@v4
        with:
          path: library/native-deps/out
          key: ounce-deps-${{ env.devkit }}-${{ hashFiles('library/native-deps/config/ounce.toml', 'library/native-deps/deps/*/ounce.toml', 'library/native-deps/deps/*/patches/*', 'library/native-deps/scripts/*') }}

      - name: Build the devkit image
        run: make devkit-image

      - name: Build the native deps
        run: make ounce-deps

      - name: Build akira
        run: make build CLOUD=false

      - name: Package for the SD card
        run: |
          mkdir -p dist/switch
          cp build/akira.nro dist/switch/akira.nro
          ( cd dist && zip -r "akira-ounce-${VERSION}.zip" switch )
          cp build/akira.nro dist/akira.nro
          ( cd build && zip -9 "../dist/akira-ounce-${VERSION}-debug-symbols.zip" akira.elf )
          ( cd dist && sha256sum "akira-ounce-${VERSION}.zip" akira.nro "akira-ounce-${VERSION}-debug-symbols.zip" > SHA256SUMS )

      - name: Write the release notes
        run: make -s release-notes VERSION="${VERSION}" > dist/RELEASE_NOTES.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          if [ "${BUILD_CHANNEL}" = "rc" ]; then FLAGS+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/akira-ounce-${VERSION}.zip" dist/akira.nro "dist/akira-ounce-${VERSION}-debug-symbols.zip" dist/SHA256SUMS \
            --title "akira-ounce ${VERSION}" --notes-file dist/RELEASE_NOTES.md "${FLAGS[@]}"
